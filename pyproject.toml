[project]
name = "ape"
version = "0.1.0"
description = "Prompt evolution for UML activity-diagram PlantUML generation"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Curry09" },
]
dependencies = [
    "python-dotenv>=1.0",
]

[project.scripts]
ape-prompt-evolve = "prompt_evolve:main"

[tool.setuptools]
py-modules = ["prompt_evolve"]

[tool.setuptools.packages.find]
include = ["evaluators*", "utils*"]
