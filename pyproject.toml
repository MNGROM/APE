[project]
name = "ape"
version = "0.1.0"
description = "Prompt evolution for UML activity-diagram PlantUML generation"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Curry09" },
]
dependencies = [
    "python-dotenv>=1.0",
    "sentence-transformers>=3.0",
]

[project.scripts]
ape-prompt-evolve = "run:main"

[tool.setuptools]
py-modules = [
    "config",
    "evaluation",
    "llm",
    "llm_element_metrics",
    "metrics",
    "prediction",
    "prompt_evolve",
    "prompt_ops",
    "run",
    "versioning",
]

[tool.setuptools.packages.find]
include = ["analysis*", "datasets*", "utils*"]
